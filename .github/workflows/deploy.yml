name: Publicar invitaciones en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Verificar que la hoja de estilos se publique
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const cssUrl = html.match(/href="(\/invitaciones-grado-pro\/assets\/[^"]+\.css)"/)?.[1];
          if (!cssUrl) {
            console.error('ERROR: falta el CSS en el HTML publicado.');
            process.exit(1);
          }
          const cssPath = 'dist' + cssUrl.replace('/invitaciones-grado-pro', '');
          if (!fs.existsSync(cssPath) || fs.statSync(cssPath).size < 1000) {
            console.error('ERROR: no se generó el archivo de estilos:', cssPath);
            process.exit(1);
          }
          console.log('CSS verificado:', cssUrl, fs.statSync(cssPath).size, 'bytes');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar disponibilidad del artefacto
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
